# Database only: PostgreSQL + PostGIS + pgRouting. The backend and frontend run on your machine (see README).
# Settings come from a file named .env next to this file (copy .env.example to .env and set DB_PASSWORD).
services:
  db:
    image: ${POSTGIS_IMAGE:-pgrouting/pgrouting-extra:16-3.5-4.0}
    container_name: flood_postgis
    environment:
      POSTGRES_USER: ${DB_USER:-flood}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-flood_db}
    ports:
      - "127.0.0.1:5433:5432"        # reachable from this machine only
    volumes:
      - flood_pgdata:/var/lib/postgresql/data
      # Runs once, on the first start of an EMPTY database: enables PostGIS and pgRouting and creates the base tables.
      - ./db/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    restart: unless-stopped
volumes:
  flood_pgdata:
